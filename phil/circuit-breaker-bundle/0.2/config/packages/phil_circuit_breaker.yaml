# The circuit breakers of phil/circuit-breaker-bundle: see vendor/phil/circuit-breaker-bundle/doc/configuration.md for
# every option. In the prod environment, once a circuit is declared, the states must live in a pool every server
# shares, such as Redis, or single_server must say that there is one server.
phil_circuit_breaker:
    # clock: clock
    # state_store: ~
    # cache_pool: cache.app
    # single_server: false

    # One circuit breaker per key; http_client puts that HTTP client behind its circuit.
    circuits: {}
